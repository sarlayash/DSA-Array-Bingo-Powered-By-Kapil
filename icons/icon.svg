<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="110" fill="none" stroke="#00f3ff" stroke-width="6" opacity="0.4"/>

  <!-- Array Brackets [ ] -->
  <path d="M 90 140 L 50 140 L 50 372 L 90 372" fill="none" stroke="#00f3ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <path d="M 422 140 L 462 140 L 462 372 L 422 372" fill="none" stroke="#ff007f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Glowing Arcade Tambola Ball -->
  <circle cx="256" cy="256" r="140" fill="url(#ballGrad)" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="128" fill="#0f172a" stroke="#ffe600" stroke-width="8"/>

  <!-- 3D highlight on sphere -->
  <circle cx="205" cy="195" r="45" fill="#ffffff" opacity="0.25"/>

  <!-- Center Number "42" / "DSA" -->
  <text x="256" y="278" font-family="'Impact', 'Arial Black', sans-serif" font-size="115" font-weight="900" fill="#00f3ff" text-anchor="middle" letter-spacing="-4">42</text>
  <text x="256" y="325" font-family="'Arial', sans-serif" font-size="24" font-weight="800" fill="#ffe600" text-anchor="middle" letter-spacing="4">ARRAY</text>

  <!-- Arcade Star sparkles -->
  <polygon points="120,90 126,106 142,112 126,118 120,134 114,118 98,112 114,106" fill="#ffe600"/>
  <polygon points="380,80 385,93 398,98 385,103 380,116 375,103 362,98 375,93" fill="#00f3ff"/>
  <polygon points="390,410 395,423 408,428 395,433 390,446 385,433 372,428 385,423" fill="#ff007f"/>
</svg>
